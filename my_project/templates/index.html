<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI文案评测对比系统</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <h1>AI文案评测对比系统</h1>
        
        <div class="input-section">
            <label for="styleSelect">文风选择:</label>
            <select id="styleSelect"></select>
            <input type="text" id="customStyle" placeholder="请输入自定义文风" style="display: none;">
        </div>
        
        <div class="input-section">
            <label for="userPrompt">用户提示词:</label>
            <textarea id="userPrompt" rows="3" placeholder="请输入提示词，例如：请根据图片内容生成一段描述..."></textarea>
        </div>
        
        <div class="control-section">
            <button id="processBtn" onclick="processData()" disabled>开始处理</button>
            <button id="exportBtn" onclick="exportToExcel()" disabled>导出 Excel</button>
        </div>
        
        <div id="loading" class="loading" style="display: none;">
            <div class="spinner"></div>
            <p>正在加载...</p>
        </div>
        
        <div id="dataList" class="data-list"></div>
    </div>
    
    <!-- 图片预览模态框 -->
    <div id="imagePreviewModal" class="modal">
        <span class="modal-close">&times;</span>
        <div class="modal-zoom-controls">
            <button onclick="zoomInPreview()">+</button>
            <button onclick="zoomOutPreview()">-</button>
            <button onclick="resetZoom()">重置</button>
        </div>
        <div class="modal-image-container" id="modalImageContainer">
            <img class="modal-content" id="previewImage">
        </div>
        <div id="caption"></div>
        <div class="modal-hint">滚轮缩放 | 双指缩放 | 拖拽移动 | 双击重置</div>
    </div>
    
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
